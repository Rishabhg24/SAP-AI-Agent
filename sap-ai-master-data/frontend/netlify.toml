[build]
  command = "npm run build"
  publish = "dist"

# Netlify reverse proxy rewrite to Render backend API
[[redirects]]
  from = "/api/*"
  to = "https://sap-ai-agent-4p9l.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback:
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
